<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Would AI Have Made My Trade?</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .viewer {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .viewer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .counter {
    position: fixed;
    bottom: 1rem;
    right: 1.2rem;
    color: #aaa;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="viewer">
  <img id="slide-img" src="slides/slide1.png" alt="Slide 1">
</div>
<div class="counter"><span id="current">1</span> / <span id="total">6</span></div>

<script>
  const totalSlides = 6;
  let current = 1;
  const img = document.getElementById("slide-img");
  const currentLabel = document.getElementById("current");

  function showSlide(n) {
    current = Math.min(Math.max(n, 1), totalSlides);
    img.src = `slides/slide${current}.png`;
    img.alt = `Slide ${current}`;
    currentLabel.textContent = current;
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      showSlide(current + 1);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      showSlide(current - 1);
    } else if (e.key === "f" || e.key === "F") {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  });

  document.addEventListener("click", function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    }
  });
</script>

</body>
</html>
